name: CI - Build and Test

# Trigger this workflow on pull requests and pushes to main/develop branches
on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Use WPILib's official cross-compilation container for RoboRIO
    container: wpilib/roborio-cross-ubuntu:2024-22.04
    
    steps:
    # Check out the repository code
    - name: Checkout code
      uses: actions/checkout@v4
      
    # Fix git safe directory warning in container environments
    - name: Add repository to git safe directories
      run: git config --global --add safe.directory $GITHUB_WORKSPACE
    
    # Install a newer GCC/libstdc++ to provide GLIBCXX_3.4.32 for PhotonVision JNI
    # - name: Install newer libstdc++
    #   run: |
    #     sudo apt-get install -y gnupg ca-certificates
    #     sudo mkdir -p /etc/apt/keyrings
    #     curl -fsSL https://apt.kitware.com/keys/kitware-archive-latest.asc | sudo gpg --dearmor -o /etc/apt/keyrings/kitware-archive-keyring.gpg
    #     echo "deb [signed-by=/etc/apt/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu jammy main" | sudo tee /etc/apt/sources.list.d/kitware.list
    #     sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
    #     sudo apt-get update
    #     sudo apt-get install -y gcc-13 g++-13 libstdc++6
    #     sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100
    #     sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100

    # Make the Gradle wrapper executable (needed on Linux)
    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew
      
    # Compile the robot code and dependencies
    - name: Build with Gradle
      run: ./gradlew build
      
    # Publish test results as GitHub check annotations
    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: |
          build/test-results/**/*.xml
        check_name: Unit Test Results
        fail_on_empty: false
        
    # Upload code coverage to Codecov for tracking
    - name: Upload test coverage
      uses: codecov/codecov-action@v3
      if: always()
      with:
        files: ./build/reports/jacoco/test/jacocoTestReport.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        
    # Add test results as a comment on pull requests
    - name: Comment test results on PR
      uses: dorny/test-reporter@v1
      if: always() && github.event_name == 'pull_request'
      with:
        name: Test Results
        path: build/test-results/**/*.xml
        reporter: java-junit
        fail-on-error: true
        fail-on-empty: false
